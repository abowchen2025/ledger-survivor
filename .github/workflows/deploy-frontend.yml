# push main 時 build 前端並部署到 GitHub Pages（專案站台 /ledger-survivor/）。
# 前置設定：GitHub repo Settings → Pages → Source 選「GitHub Actions」。
# 需要的 GitHub Secret（值不寫在這裡，清單見 README.md「需要的 GitHub 設定」）：
#   secrets.VITE_API_BASE_URL   Railway 後端網址，只到 host，例如 https://xxx.up.railway.app
# 這是 Vite 建置期變數，會嵌進 bundle；缺了就讓 build 失敗（fail closed），不要部署一個打不到後端的前端。
# API 金鑰**不**在這裡注入：由使用者在設定頁輸入、存 localStorage（docs/adr/0007）；production build 忽略 VITE_DEV_API_KEY。
name: Deploy frontend (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/tests/fixtures/week_cases.json" # vitest 讀這份
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: vitest
        run: npm run test

      - name: Check build-time secret is set
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::error::GitHub Secret VITE_API_BASE_URL is not set (see README.md 需要的 GitHub 設定)"
            exit 1
          fi

      - name: Build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          # 故意塞一個哨兵值：production build 必須完全忽略 VITE_DEV_API_KEY，下一步用產物驗證
          VITE_DEV_API_KEY: canary-must-not-appear-in-dist
        run: npm run build

      - name: Assert no API key in the bundle
        # 金鑰不得進產物（docs/adr/0007）：哨兵值出現在 dist 就代表 production build 會嵌入金鑰，擋下部署
        run: |
          if grep -rq "canary-must-not-appear-in-dist\|dev-local-only-not-a-secret" dist; then
            echo "::error::dist contains the VITE_DEV_API_KEY value; production build must ignore it"
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

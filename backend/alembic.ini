# NOTE: keep this file ASCII-only (English comments). On Windows with the cp950 (Big5) locale,
# alembic reads this ini with the system default encoding and non-ASCII bytes break the parser.
# Do not translate these comments to Chinese.
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
# sqlalchemy.url is set in alembic/env.py from app.config.settings (DATABASE_URL); keep this file ASCII for Windows cp950 locale

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

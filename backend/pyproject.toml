[project]
name = "ledger-survivor-backend"
version = "0.1.0"
description = "Ledger Survivor backend (FastAPI + SQLAlchemy 2.x + Alembic + PostgreSQL 16)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "p0: P0 core tests, must pass before merge",
    "p1: P1 tests",
]
# 只忽略下列兩個「來自第三方套件、與本專案程式碼無關」的 DeprecationWarning，
# 以 message + 發出模組做最窄比對，不做全域 ignore::DeprecationWarning。
# 其他 warning 一律照常顯示，出現新 warning 就是要看的訊號。
filterwarnings = [
    # 來源：starlette 1.6 的 TestClient 在 import 時偵測到後端是 httpx 0.28（非 httpx2）
    # 就發出 StarletteDeprecationWarning（UserWarning 子類，不是 DeprecationWarning），
    # 發出點被 stacklevel 指到 fastapi.testclient 第 1 行。等改裝 httpx2 或 starlette
    # 移除此檢查後（升級後此 warning 消失）移除這一行。
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning:fastapi.testclient",
    # 來源：starlette 1.6 的 testclient.py 仍引用 anyio.abc.BlockingPortal 舊別名，
    # anyio 4.15 已改為 anyio.from_thread.BlockingPortal。等 starlette 修正後
    # （升級後此 warning 消失）移除這一行。
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]

[tool.alembic]
script_location = "alembic"

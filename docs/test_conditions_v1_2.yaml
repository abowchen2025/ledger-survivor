# 記帳生存遊戲（Ledger Survivor）測試條件 v1.2
# 日期：2026-09-24（首版 2026-09-16）
# 依據：SRS+FS v1.6.1（req 欄回追對應 REQ 編號；第 5～8 節規格缺口已回收進 SRS，本檔不再引用 spec-gaps 作為規格來源）、
#       架構描述 v2.2 第11節（品質與驗證，11.5高風險區重點覆蓋）
# 合併：以 v1.1（78 條）為基底，依序併入《測試條件 v1.3 補充》（5 條）、《v1.4 補充》（2 條）、《v1.5 補充》（1 條），
#       並登記 repo 已有測試但 YAML 未登記的條目（REQ-NFR-010 統一錯誤格式、使用者隔離、已結算月份判定、前端 payload 契約測試）
# 格式骨架：rachel-qa TC 格式（分類標準：AUTH／SEC／FUNC／UI／E2E／EDGE／NEG／PERF）
# 用途：Claude Code 讀取本檔案後，依 script 路徑產生對應測試碼；執行結果回填 actual／status 供規劃端判讀
# 優先級：P0（核心不可妥協，上線前必過）／P1（重要）／P2（次要，可延後）

